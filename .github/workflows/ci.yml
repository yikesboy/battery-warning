name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Check
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build
        run: nix build --no-update-lock-file --print-build-logs
      - name: Check CLI
        run: |
          ./result/bin/battery-warning --help
          ./result/bin/battery-warning --version
